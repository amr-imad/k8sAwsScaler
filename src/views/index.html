<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Status</title>

    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        background: var(--bg);
        color: #e2e8f0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 40px;
        width: 90%;
        max-width: 520px;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
        font-size: 12px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .box {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .label {
        font-size: 12px;
        color: #94a3b8;
      }

      .value {
        font-size: 16px;
        margin-top: 4px;
        font-weight: 600;
      }
    </style>
  </head>

  <body style="--bg: {{theme}};">
    <div class="card">
      <div class="badge">SYSTEM ONLINE</div>

      <h1>{{service}}</h1>

      <div class="box">
        <div class="label">Mode</div>
        <div class="value">{{mode}}</div>
      </div>

      <div class="box">
        <div class="label">Container / Host</div>
        <div class="value">{{hostname}}</div>
      </div>

      <div class="box">
        <div class="label">Uptime</div>
        <div class="value">{{uptime}}s</div>
      </div>

      <div class="box">
        <div class="label">Metrics Endpoint</div>
        <div class="value">{{metricsPath}}</div>
      </div>
    </div>
  </body>
</html>
